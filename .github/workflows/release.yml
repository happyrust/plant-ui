name: Build and Release

on:
  push:
    branches:
      - publish-version
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows and Web release artifacts
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: plant-ui-release

      # The checked-in Cargo config points at the developer machine's complete
      # vendored registry. GitHub-hosted runners resolve the locked graph online.
      - name: Use network dependency sources
        shell: pwsh
        run: Rename-Item .cargo/config.toml config.local.toml

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          "PLANT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }

      - name: Check workspace
        shell: pwsh
        run: cargo check --workspace --all-targets --locked

      - name: Build Windows application
        shell: pwsh
        run: cargo build -p rs-plant --release --locked

      - name: Build Web application
        shell: pwsh
        run: ./scripts/build-wasm.ps1

      - name: Package release artifacts
        shell: pwsh
        run: |
          $suffix = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$env:PLANT_VERSION-$env:GITHUB_REF_NAME" }

          $windowsName = "plant-ui-$suffix-windows-x64"
          New-Item -ItemType Directory -Path $windowsName | Out-Null
          Copy-Item target/release/rs-plant.exe "$windowsName/"
          Copy-Item DbOption.toml "$windowsName/"
          Copy-Item resource "$windowsName/resource" -Recurse
          Compress-Archive -Path "$windowsName/*" -DestinationPath "$windowsName.zip"

          $webName = "plant-ui-$suffix-web"
          New-Item -ItemType Directory -Path $webName | Out-Null
          Copy-Item web/public/* "$webName/" -Recurse
          Compress-Archive -Path "$webName/*" -DestinationPath "$webName.zip"

          Get-FileHash "$windowsName.zip", "$webName.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii SHA256SUMS

      - name: Upload publishable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plant-ui-${{ github.run_id }}
          path: |
            plant-ui-*.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy Web and publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PLANT_UI_URL }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: plant-ui-${{ github.run_id }}
          path: dist

      - name: Verify and prepare Web deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          PLANT_DB_USER: ${{ secrets.PLANT_DB_USER }}
          PLANT_DB_PASSWORD: ${{ secrets.PLANT_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          web_zip=$(find . -maxdepth 1 -name '*-web.zip' -print -quit)
          test -n "$web_zip"
          mkdir deploy
          unzip -q "$web_zip" -d deploy
          test -f deploy/index.html
          test -f deploy/pkg/rs-plant_bg.wasm

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          host = os.environ["DEPLOY_HOST"]
          config = {
              "db": {
                  "host": host,
                  "port": 8020,
                  "secure": False,
                  "namespace": "1516",
                  "database": "AvevaMarineSample",
                  "mdb": "/ALL",
                  "username": os.environ["PLANT_DB_USER"],
                  "password": os.environ["PLANT_DB_PASSWORD"],
              },
              "model_api_url": f"http://{host}",
              "data_api_url": f"http://{host}",
          }
          Path("deploy/config.json").write_text(
              json.dumps(config, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          tar -C deploy -czf plant-ui-web-deploy.tar.gz .

      - name: Deploy Web to production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$DEPLOY_PASSWORD"

          archive="/tmp/plant-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          sshpass -e scp -o StrictHostKeyChecking=yes \
            dist/plant-ui-web-deploy.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$archive"

          cat > remote-deploy.sh <<'REMOTE'
          set -euo pipefail
          sha="$1"
          attempt="$2"
          run_id="$3"
          host="$4"
          archive="/tmp/plant-ui-${run_id}-${attempt}.tar.gz"
          release="/var/www/plant-ui/releases/${sha}-${attempt}"
          link="/var/www/plant3d-web/plant-ui"
          rollback="/var/www/plant-ui/rollback.sh"
          trap 'rm -f "$archive"' EXIT

          install -d "$release"
          tar -xzf "$archive" -C "$release"
          test -f "$release/index.html"
          test -f "$release/pkg/rs-plant_bg.wasm"

          previous=$(readlink -f "$link" || true)
          if [[ -n "$previous" ]]; then
            printf '#!/usr/bin/env bash\nset -euo pipefail\nln -sfn %q %q\n' \
              "$previous" "$link" > "$rollback"
          else
            printf '#!/usr/bin/env bash\nset -euo pipefail\nrm -f %q\n' \
              "$link" > "$rollback"
          fi
          chmod 700 "$rollback"

          ln -sfn "$release" "$link"
          curl -fsS -H "Host: $host" http://127.0.0.1/plant-ui/ >/dev/null
          REMOTE

          sshpass -e ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA' '$GITHUB_RUN_ATTEMPT' '$GITHUB_RUN_ID' '$DEPLOY_HOST'" \
            < remote-deploy.sh

      - name: Verify public deployment
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.PLANT_UI_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PUBLIC_URL" >/dev/null
          curl --fail --silent --show-error --head \
            "${PUBLIC_URL}pkg/rs-plant_bg.wasm" >/dev/null
          printf '### Deployment verified\n\n[%s](%s)\n' "$PUBLIC_URL" "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ vars.PLANT_UI_URL }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## 在线预览

          **访问地址：[$PUBLIC_URL]($PUBLIC_URL)**

          - Commit: \`$GITHUB_SHA\`
          - CI: [GitHub Actions run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              dist/plant-ui-*.zip dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --notes-file release-notes.md --title "Plant UI $GITHUB_REF_NAME"
          elif gh release view publish-version-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload publish-version-latest \
              dist/plant-ui-*.zip dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit publish-version-latest \
              --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Plant UI publish-version latest" --notes-file release-notes.md
          else
            gh release create publish-version-latest \
              dist/plant-ui-*.zip dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Plant UI publish-version latest" --notes-file release-notes.md
          fi
