[package]
name = "rs-plant"
version.workspace = true
edition.workspace = true

[features]
default = ["virtual-hole-csg"]
# 虚拟孔洞布尔预览（ADR-0031）：原生端 manifold-csg 内核，默认开启。
virtual-hole-csg = ["plant-ui-view3d/virtual-hole-csg"]
# `--look-demo` / `?look_demo=1` 的演示厂：debug 构建总带着，release 构建要它时开这个。
look-demo = ["plant-ui-view3d/look-demo"]

[dependencies]
plant-ui.workspace = true
plant-ui-data.workspace = true
plant-ui-view3d.workspace = true
aios_core.workspace = true
plant-mbd.workspace = true
egui.workspace = true
eframe.workspace = true
egui-phosphor.workspace = true
# 验收探针的两半都用它：`inspect` 那个 bin 用它的线协议（可移植），主程序用它的
# `attach_from_env` 起服务（只有原生端有，见 `attach_inspection`）。
egui_inspection.workspace = true
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
calamine.workspace = true
glam.workspace = true
ron.workspace = true
url.workspace = true
chrono.workspace = true
bevy.workspace = true
bevy_egui35.workspace = true
ehttp.workspace = true
ewebsock.workspace = true
web-time.workspace = true

[dev-dependencies]
# 虚拟孔洞导入测试：在内存里拼最小 xlsx 喂给 calamine（与 calamine 自己用的同一版 zip）。
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy-wasm-tasks = { workspace = true, features = ["tokio"] }
config.workspace = true
rfd.workspace = true
# 对拍探针（`--read-face-parity`）无头跑，没有 Bevy 替它起运行时，自己起一个。
# 界面那条路仍由 bevy-wasm-tasks 驱动，这里不另开第二条数据线程。
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy-wasm-tasks = { workspace = true, features = ["wasm"] }
getrandom = { workspace = true, features = ["wasm_js"] }
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }
wasm-bindgen.workspace = true
# 虚拟孔洞（ADR-0031）：浏览器端文件上传（隐藏 input + array_buffer）。
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlInputElement",
    "Location",
    "Window",
    "console",
] }
