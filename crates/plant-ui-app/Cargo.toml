[package]
name = "plant-ui-app"
version.workspace = true
edition.workspace = true

[dependencies]
plant-ui.workspace = true
plant-ui-data.workspace = true
plant-ui-view3d.workspace = true
aios_core.workspace = true
egui.workspace = true
eframe.workspace = true
egui-phosphor.workspace = true
egui_inspection.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
bevy.workspace = true
bevy_egui35.workspace = true
ehttp.workspace = true
ewebsock.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy-wasm-tasks = { workspace = true, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy-wasm-tasks = { workspace = true, features = ["wasm"] }
getrandom = { workspace = true, features = ["wasm_js"] }
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }
wasm-bindgen.workspace = true
