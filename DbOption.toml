# 模型树根层按本 MDB 解析出的 DESI 库号取 SITE（rs-core 的 MDB_DESI_DBNOS）。
# /ALL1 在 8009 这个库里只对应一个 DESI 库 7997，而 7997 还没解析，选它模型树是空的；
# /ALL 对应 29 个库，含已解析的 8000，能展出四个 SITE。
mdb_name = "ALL"
project_name = "AvevaMarineSample"
project_code = 1516
surreal_ns = 1516
module = "DESI"
#是否生成模型数据
# 非CATA增量监听模式：启动不做全量重算，靠 watcher 增量刷新（增量路径自行强制 gen_model/gen_mesh=true）
gen_model = false
gen_mesh = false
replace_mesh = false
save_db = true
apply_boolean_operation = true
mesh_tol_ratio = 3.0
#是否生成房间树
gen_spatial_tree = false
load_spatial_tree = false
save_spatial_tree_to_db = false
gen_model_batch_size = 16

build_cate_relate = false

# 最小交付单元类型（增量 / 手动 / 按需生成共用的生成根口径）
# 不配置时使用默认集合 ["BRAN", "HANG", "SUPPO", "EQUI"]
# delivery_unit_types      完全取代默认集合；写成 [] 表示不使用交付单元，全部按正常颗粒生成
# append_delivery_unit_types  在默认集合之外追加，仅在未配置 delivery_unit_types 时生效
# 两者都会 trim + 转大写 + 去重，且拒绝 WORL/WORLD/SITE/ZONE 和管件 FTUB
# delivery_unit_types = ["BRAN", "HANG", "SUPPO", "EQUI"]
# append_delivery_unit_types = ["PIPE"]

