[package]
name = "bevy_egui35"
version = "0.35.1"
# Needed for LazyLock https://doc.rust-lang.org/stable/std/sync/struct.LazyLock.html
rust-version = "1.80.0"
authors = ["vladbat00 <vladyslav.batyrenko@gmail.com>"]
description = "A plugin for Egui integration into Bevy"
license = "MIT"
edition = "2021"
repository = "https://github.com/vladbat00/bevy_egui"
exclude = ["assets/**/*", ".github/**/*"]

[package.metadata.docs.rs]
features = ["bevy_winit/x11", "immutable_ctx"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["manage_clipboard", "open_url", "default_fonts", "render", "picking"]
accesskit_placeholder = ["bevy_a11y"]
immutable_ctx = []
manage_clipboard = ["arboard", "thread_local", "bytemuck"]
open_url = ["webbrowser"]
default_fonts = ["egui/default_fonts"]
render = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_render",
    "bevy_transform",
    "encase",
    "bytemuck",
    "egui/bytemuck",
    "wgpu-types",
]
picking = ["render", "bevy_picking"]
serde = ["egui/serde"]
# The enabled logs will print with the info log level, to make it less cumbersome to debug in browsers.
log_input_events = []
# The enabled logs will print with the info log level, to make it less cumbersome to debug in browsers.
log_file_dnd_events = []

[dependencies]
egui = { version = "=0.35.0", default-features = false }
bevy_a11y = { git = "https://gitee.com/happydpc/bevy.git", optional = true }
bevy_app = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_derive = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_ecs = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_input = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_log = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_math = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_reflect = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_time = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_transform = { git = "https://gitee.com/happydpc/bevy.git", optional = true }
bevy_winit = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_window = { git = "https://gitee.com/happydpc/bevy.git" }
bevy_platform = { git = "https://gitee.com/happydpc/bevy.git" }

# `open_url` feature
webbrowser = { version = "1.0.1", optional = true }

# `render` feature
bytemuck = { version = "1", optional = true }
bevy_asset = { git = "https://gitee.com/happydpc/bevy.git", optional = true }
bevy_core_pipeline = { git = "https://gitee.com/happydpc/bevy.git", optional = true }
bevy_image = { git = "https://gitee.com/happydpc/bevy.git", optional = true }
bevy_render = { git = "https://gitee.com/happydpc/bevy.git", optional = true }
encase = { version = "0.10", optional = true }
wgpu-types = { git = "https://gitee.com/happydpc/wgpu", optional = true }

# `picking` feature
bevy_picking = { git = "https://gitee.com/happydpc/bevy.git", optional = true, features = ["bevy_mesh_picking_backend"] }

# `manage_clipboard` feature
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
arboard = { version = "3.2.0", optional = true }
thread_local = { version = "1.1.0", optional = true }

[dev-dependencies]
version-sync = "0.9.5"
bevy = { git = "https://gitee.com/happydpc/bevy.git", default-features = false, features = [
    "accesskit_unix",
    "bevy_log",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_mesh_picking_backend",
    "bevy_sprite",
    "bevy_window",
    "bevy_winit",
    "android-game-activity",
    "png",
    "std",
    "tonemapping_luts",
    "webgl2",
    "x11",
] }
egui = { version = "=0.35.0", default-features = false, features = ["bytemuck"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dev-dependencies]
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
winit = { git = "https://gitee.com/happydpc/winit" }
web-sys = { version = "0.3.74", features = [
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "DataTransfer",
    "Document",
    "EventTarget",
    "HtmlInputElement",
    "InputEvent",
    "KeyboardEvent",
    "Navigator",
    "TouchEvent",
    "Window",
] }
image = { version = "0.25.5", default-features = false, features = ["png"] } # For copying images
js-sys = "0.3.63"
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.36"
crossbeam-channel = "0.5.8"
