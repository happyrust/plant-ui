[package]
edition = "2024"
name = "bevy_render"
version = "0.16.0-dev"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Provides rendering functionality for Bevy Engine"
homepage = "https://bevy.org"
