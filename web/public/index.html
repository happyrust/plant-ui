<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>plant-ui</title>
    <style>
      html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #111827; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="plant-ui"></canvas>
    <script type="module">
      import init, { start } from "./pkg/plant_ui_app.js";

      const [config] = await Promise.all([
        fetch("./config.json", { cache: "no-store" }).then(response => {
          if (!response.ok) throw new Error(`config.json: HTTP ${response.status}`);
          return response.json();
        }),
        init(),
      ]);
      start("#plant-ui", JSON.stringify(config));
    </script>
  </body>
</html>
