[workspace]
resolver = "2"
members = ["crates/plant-ui", "crates/plant-ui-data", "crates/plant-ui-app"]
# vendor path deps must NOT be auto-absorbed as workspace members (would build with their own default features)
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
plant-ui = { path = "crates/plant-ui" }
plant-ui-data = { path = "crates/plant-ui-data" }
# vendored from rs-core-pin (= git rev 5667b70 + get_world fallthrough fix), editable
aios_core = { path = "vendor/rs-core", default-features = false }

egui = "0.35.0"
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "accesskit", "inspection"] }
egui_extras = "0.35"
egui_dock = "0.20.1"
egui-phosphor = "0.13.0"
# 验收探针用它的线协议直连运行中的应用（eframe 的 inspection feature 是服务端那一半）
egui_inspection = "0.35"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.3.0"
# 手动更新的逐单元进度只在 /api/v1/ws 上发（ADR-0005）。版本对齐 vendor 里已有的那一份
# （surrealdb 的 ws 协议带进来的），不新增下载；服务端不上 TLS，所以只要 handshake。
tungstenite = "0.23.0"
# 命令行视图的本地时钟时间戳。aios_core 链上已经带进来了，不新增下载
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 三维视口的占位纹理。只开这两种编码，够读 assets/textures 下的图；
# 包本身与两个解码器链上都已有，vendor 里不新增
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# egui upstream advice: optimize deps for runtime smoothness, keep own code at 0 for fast incremental builds
[profile.dev.package."*"]
opt-level = 2
