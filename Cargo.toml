[workspace]
resolver = "2"
members = [
    "crates/plant-ui",
    "crates/plant-ui-data",
    "crates/plant-ui-view3d",
    "crates/plant-ui-app",
]
# vendor path deps must NOT be auto-absorbed as workspace members (would build with their own default features)
exclude = ["vendor"]

[workspace.package]
version = "0.1.7"
edition = "2024"

[workspace.dependencies]
plant-ui = { path = "crates/plant-ui" }
plant-ui-data = { path = "crates/plant-ui-data" }
plant-ui-view3d = { path = "crates/plant-ui-view3d" }
# vendored from rs-core-pin (= git rev 5667b70 + get_world fallthrough fix), editable
# `render` 开着 bevy_render：三维搬进来之后几何侧要它（view3d-migration.md 决定 1）
aios_core = { path = "vendor/rs-core", default-features = false, features = ["render"] }

# 三维那一半的地基。特性列表照抄 rs-plant3-d，换列表要连带核对 e3d_plugin 的用法。
bevy = { git = "https://gitee.com/happydpc/bevy", default-features = false, features = [
    "std", "bevy_winit", "bevy_asset", "bevy_render", "bevy_core_pipeline",
    "bevy_pbr", "bevy_picking", "bevy_mesh_picking_backend", "png", "webgl2",
] }
# egui 0.35 + Bevy 0.16 脱离上游支持矩阵，所以以可编辑源码树进 vendor（计划书 M3-1）
# `manage_clipboard`：两端的复制粘贴。原生走 arboard；浏览器靠 copy/cut/paste 事件
# + navigator.clipboard，配套的快捷键放行见 vendor 里 web_clipboard.rs 的捕获拦截。
# 所需依赖（arboard / thread_local / image / crossbeam-channel）全在 lock 与 vendor 里，开关不动 Cargo.lock。
bevy_egui35 = { path = "vendor/bevy_egui35", default-features = false, features = [
    "render", "default_fonts", "manage_clipboard", "open_url",
] }
# 双端 spawn：原生走 tokio、浏览器走 spawn_local（view3d-migration.md 决定 5）
bevy-wasm-tasks = { git = "https://gitee.com/happydpc/bevy-wasm-tasks", rev = "51aabcb8124ad80be902fa120c84a2e91d28c9ed" }

# 设置窗里那个「浏览…」的系统目录对话框。`default-features = false` 关掉 Linux 的
# xdg-portal 与 tokio 集成：前者会拖进 ashpd / zbus 一整串没 vendored 的包，后者这里
# 用不上——对话框跑在自己的线程上，不进异步运行时。Linux 上要构建得自己开一个后端 feature。
rfd = { version = "0.15", default-features = false }

egui = "0.35.0"
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "accesskit", "inspection"] }
egui_extras = "0.35"
egui_dock = "0.20.1"
egui-phosphor = "0.13.0"
# 验收探针用它的线协议直连运行中的应用（eframe 的 inspection feature 是服务端那一半）
egui_inspection = "0.35"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
# 数据桥的并发通道：FuturesUnordered 在一个任务里并发驱动全部交互读查询。
# 0.3.33 本来就在 lock 里（surrealdb / bevy 链带进来的），不新增下载。
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8.1"
config = "0.14.1"
url = "2"
ureq = "3.3.0"
# 双端 HTTP / WebSocket（决定 7）。原生后端就是上面这个 ureq 与下面那个 tungstenite，
# 所以两个加起来只多两个 crate。声明先于使用：换掉 model_update_api / _ws 是第二步的活。
ehttp = { version = "0.7", features = ["native-async"] }
ewebsock = "0.8"
getrandom = "0.3"
ring = "0.17"
wasm-bindgen = "=0.2.126"
# 手动更新的逐单元进度只在 /api/v1/ws 上发（ADR-0005）。版本对齐 vendor 里已有的那一份
# （surrealdb 的 ws 协议带进来的），不新增下载；服务端不上 TLS，所以只要 handshake。
tungstenite = "0.23.0"
# 命令行视图的本地时钟时间戳。aios_core 链上已经带进来了，不新增下载
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# std::time::Instant 在 wasm32-unknown-unknown 会 panic；此包在原生端保持同一 API。
web-time = "1.1"

# 上游 gpu-allocator 绑的 `windows` 版本与 wgpu-hal 的对不上，直接编不过：
# `expected ID3D12Device, found a different ID3D12Device`（两份 windows crate）。
# 这份 fork 把它钉到 windows 0.58，与 wgpu-hal 一致。rs-plant3-d 早就这么打了这个补丁，
# 搬过来的时候漏掉它就会在 wgpu-hal 上停 10 个错。
[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }

# egui upstream advice: optimize deps for runtime smoothness, keep own code at 0 for fast incremental builds
[profile.dev.package."*"]
opt-level = 2
